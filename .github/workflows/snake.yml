# Regenerates the contribution snake daily and publishes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8839ef&color_dots=#ebedf0,#dcc8f7,#bb94f2,#9a5fec,#8839ef
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#cba6f7&color_dots=#161b22,#45475a,#7f6aa8,#a98ad6,#cba6f7

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
